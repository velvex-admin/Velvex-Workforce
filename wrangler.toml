# VX-03 — Velvex internal operations layer
# Cloudflare Worker. Same host as the operations build, per the architecture doc's
# Foundation Stack: one place to manage, not two.
#
# This Worker is deliberately separate from anything in the client-facing
# operations pipeline (Phase 0). It shares no bindings, no database and no
# secrets with it.

name = "velvex-vx03"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
account_id = "cb58bfa682b8997a987de0637c7a69bc"

workers_dev = true

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Non-secret configuration.
# Secrets are NEVER put here — see .dev.vars.example and DEPLOY.md.
# ---------------------------------------------------------------------------
[vars]
VX_ENV = "production"
SUPABASE_URL = "https://ttwudgdwusorwscegtnz.supabase.co"

# Model tiers. Each agent names one of these in its own definition, chosen for
# the work it actually does; five agents make no model calls at all. See
# docs/MODEL-CHOICES.md. Defaults live in src/core/models.ts, and these vars
# exist so a whole tier can be moved without a code change.
MODEL_REASONING = "claude-opus-5"
MODEL_BALANCED = "claude-sonnet-5"
MODEL_FAST = "claude-haiku-4-5"

# Facebook / X connectors stay inactive until real credentials are supplied as
# secrets. Flipping these to "true" without setting the matching secrets is
# refused at startup by src/connectors/*.
FACEBOOK_ENABLED = "false"
X_ENABLED = "true"

# The LinkedIn agent is built by an outside company. This Worker only exposes
# the integration point it will call. No agent, no scheduling on our side.
LINKEDIN_INTEGRATION_ENABLED = "false"

# Ops-Health reads the operations pipeline read-only. Left unset on purpose:
# no Phase 0 credentials are wired into this project.
OPS_PIPELINE_MONITOR_ENABLED = "false"

# Competitive Intelligence reads the open web. This is a spend switch, not a
# credential: web search runs server side on the model call, so there is nothing
# to set up. Searches bill at $10 per 1,000 on top of the tokens their results
# consume; the agent caps itself at 8 searches and 5 page fetches per run on a
# weekly cadence, which is well under a dollar a month. Set to "false" and the
# agent works from the intel.watchlist sources alone and says so in the brief.
INTEL_WEB_RESEARCH_ENABLED = "true"

# ---------------------------------------------------------------------------
# Scheduled runs. Free-tier Supabase pauses after 7 days without API traffic;
# the hourly tick alone is enough to keep the project awake until it moves to
# Pro, as the architecture doc anticipates.
# ---------------------------------------------------------------------------
[triggers]
crons = [
  "0 * * * *",   # hourly agent tick — each agent runs if its own cadence is due
  "0 7 * * *",   # 07:00 UTC — Chief-of-Staff daily roll-up
  "0 8 * * 1"    # Monday 08:00 UTC — executive weekly review
]
