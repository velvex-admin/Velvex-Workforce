# VX-03 — Velvex internal operations layer
# Cloudflare Worker. Same host as the operations build, per the architecture doc's
# Foundation Stack: one place to manage, not two.
#
# This Worker is deliberately separate from anything in the client-facing
# operations pipeline (Phase 0). It shares no bindings, no database and no
# secrets with it.

name = "velvex-vx03"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
account_id = "cb58bfa682b8997a987de0637c7a69bc"

workers_dev = true

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Non-secret configuration.
# Secrets are NEVER put here — see .dev.vars.example and DEPLOY.md.
# ---------------------------------------------------------------------------
[vars]
VX_ENV = "production"
SUPABASE_URL = "https://ttwudgdwusorwscegtnz.supabase.co"

# Model tiers. Each agent names one of these in its own definition, chosen for
# the work it actually does; five agents make no model calls at all. See
# docs/MODEL-CHOICES.md. Defaults live in src/core/models.ts, and these vars
# exist so a whole tier can be moved without a code change.
MODEL_REASONING = "claude-opus-5"
MODEL_BALANCED = "claude-sonnet-5"
MODEL_FAST = "claude-haiku-4-5"

# Facebook / X connectors stay inactive until real credentials are supplied as
# secrets. Flipping these to "true" without setting the matching secrets is
# refused at startup by src/connectors/*.
FACEBOOK_ENABLED = "false"
X_ENABLED = "true"

# LinkedIn has two routes to the same page and they are independent.
#
# The partner queue is the original architecture doc's integration point: an
# outside agent drains it. We own the strategist regardless, per the owner.
LINKEDIN_INTEGRATION_ENABLED = "false"
#
# Direct posting through our own connector. Off until the Community Management
# API app is approved and LINKEDIN_ORG_ID / LINKEDIN_ACCESS_TOKEN are set as
# secrets. When this is "true" and both secrets exist, the strategist publishes
# through the connector and stops using the partner queue. Either way, every
# LinkedIn post waits for the owner's approval first - that is a rule in the
# agent, not a consequence of the transport.
LINKEDIN_DIRECT_ENABLED = "false"

# Ops-Health reads the operations pipeline read-only. Left unset on purpose:
# no Phase 0 credentials are wired into this project.
OPS_PIPELINE_MONITOR_ENABLED = "false"

# Competitive Intelligence reads the open web. This is a spend switch, not a
# credential: web search runs server side on the model call, so there is nothing
# to set up. Searches bill at $10 per 1,000 on top of the tokens their results
# consume; the agent caps itself at 8 searches and 5 page fetches per run on a
# weekly cadence, which is well under a dollar a month. Set to "false" and the
# agent works from the intel.watchlist sources alone and says so in the brief.
INTEL_WEB_RESEARCH_ENABLED = "true"

# ---------------------------------------------------------------------------
# Scheduled runs. Free-tier Supabase pauses after 7 days without API traffic;
# the hourly tick alone is enough to keep the project awake until it moves to
# Pro, as the architecture doc anticipates.
# ---------------------------------------------------------------------------
[triggers]
# The weekly cadence USED to run on two Monday ticks, because a cron invocation
# gets 15 minutes of wall clock for everything it runs and Competitive
# Intelligence measured 10m03s on its own. That split cost a cron line, and when
# the account limit turned out to be five, the 08:00 line was the one to give up:
# it was filtered to the intelligence batch, intelligence is monthly, so it fired
# every Monday and ran nothing at all.
#
# The consequence is that intelligence's MONTHLY cadence is now load-bearing
# rather than only a cost choice. Set it back to weekly and it shares the 09:00
# tick with Growth-Strategy, which is the squeeze the split existed to prevent —
# so runDue logs a warning when that happens instead of letting it be silent.
#
# The hourly tick is split against the other per-invocation limit: an invocation
# also gets roughly 50 subrequests for everything it runs. Site-Integrity runs
# last and fetches every stored page, so it is the one that finds them spent, and
# it died that way on consecutive hourly ticks on 2026-08-29 leaving no error at
# all. Its own slot at :30 gives it a fresh budget. The two hourly lines are a
# partition — everything hourly except site_integrity, then site_integrity alone
# — and test/hourly-split.test.ts asserts that against the real roster, because
# dropping it from one without adding it to the other fails silently.
# FIVE LINES, AND THAT IS A HARD CEILING. Workers Free allows 5 cron triggers
# per ACCOUNT, not per Worker and not per day. A sixth is refused by the API with
# code 10072 — and the refusal does NOT roll back the script upload, so the new
# code goes live against the old cron table. That is how site_integrity ended up
# orphaned for eighteen hours: the code stopped running it on the hourly tick and
# the :30 tick it was moved to had never been created.
#
# So adding a schedule here means removing one. Workers Paid raises the limit to
# 1,000 for $5/month, which is the clean fix whenever that is worth it.
crons = [
  "0 * * * *",   # hourly agent tick — everything hourly EXCEPT site_integrity
  "30 * * * *",  # half past — site_integrity alone, on its own subrequest budget
  "0 7 * * *",   # 07:00 UTC — Chief-of-Staff daily roll-up
  "0 8 1 * *",   # 1st of the month 08:00 UTC — monthly agents (intelligence)
  "0 9 * * 1"    # Monday 09:00 UTC — weekly, all of it
]
